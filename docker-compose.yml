services:
  backend:
    build:
      context: ./back
    restart: unless-stopped
    env_file:
      - ./back/.env.production
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./student
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
