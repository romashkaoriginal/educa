map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Ограничивает автоматическое сканирование API, сохраняя запас для
# параллельной загрузки экранов Telegram Mini App.
limit_req_zone $binary_remote_addr zone=educa_api_per_ip:10m rate=20r/s;

server {
    listen 80;
    server_name YOUR_DOMAIN;
    client_max_body_size 12m;

    server_tokens off;
    limit_req_status 429;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location ~ /\.(?!well-known) {
        return 404;
    }

    location /api/ {
        # Загрузка изображений практики — до 10 МБ исходник (ТЗ §5.2).
        limit_req zone=educa_api_per_ip burst=40 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
