<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="theme-color" content="#1E40AF" />
    <title>KUBIK - Образовательная платформа</title>
    <!-- crossorigin — telegram.org отдаёт Access-Control-Allow-Origin: *, поэтому браузер
         может раскрыть настоящий message/stack исключений из этого скрипта. Без атрибута
         любая ошибка внутри него (или в коде, вызванном из его колбэков) доходит до нашего
         window.onerror как непрозрачное "Script error." без деталей — именно это видно
         в панели ошибок ученикам. -->
    <script src="https://telegram.org/js/telegram-web-app.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <noscript>Вам нужно включить JavaScript для работы приложения.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
